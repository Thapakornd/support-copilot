[project]
name = "support-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thapakorn", email = "thapakornmeethan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
support-copilot = "support_copilot:main"
support-copilot-prepare-knowledge = "support_copilot.knowledge.cli:main"
support-copilot-import-documents = "support_copilot.knowledge.import_documents:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.2,<6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
