services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: support_copilot
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: support_copilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_copilot -d support_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: